[artifacts]
source = ["src/policyops/graph"]
tests = ["tests/graph"]
evidence = ["build/ch07/graph_results.jsonl", "build/ch07/graph_scorecard.json", "build/ch07/repair_receipt.json", "build/ch07/graph_vs_rag_adr.json"]

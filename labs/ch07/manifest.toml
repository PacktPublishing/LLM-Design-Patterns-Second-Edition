[lab]
id = "ch07"
title = "Graph Retrieval"
profile = "fixture"
requires = ["ch01", "ch02", "ch03", "ch04", "ch05", "ch06"]

[commands]
verify = "uv run policyops verify ch07 --profile fixture --junit build/ch07/junit.xml --evidence build/ch07"
